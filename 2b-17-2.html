<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2B 17과 말하기2 | 분실물 센터 대화</title>
  <style>
    :root {
      --bg-page: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --staff-theme: #0284c7;
      --staff-hover: #0369a1;
      --staff-bubble: #ffffff;
      --kelly-theme: #e11d48;
      --kelly-hover: #be123c;
      --kelly-bubble: #fef01b;
      --chat-bg: #a3bad2;
      --chat-header: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 14px;
      overflow-x: hidden;
    }
    .app-container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
    }
    .badge-wrap { display: flex; align-items: center; gap: 8px; }
    .badge-unit {
      background: #fef3c7;
      color: #b45309;
      font-size: 0.88rem;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid #fde68a;
    }
    .title-main { font-size: 1.15rem; font-weight: 800; }
    .btn-qr-action {
      background: #fef3c7;
      border: 1px solid #fde68a;
      color: #92400e;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
    }
    .scenario-selector {
      display: flex;
      gap: 8px;
      background: #ffffff;
      padding: 6px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
    }
    .btn-scenario {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
    }
    .btn-scenario.active {
      background: #0f172a;
      color: #ffffff;
    }
    .guide-bar {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .btn-turn-flow {
      padding: 7px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: #ffffff;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-turn-flow:disabled {
      background: #cbd5e1;
      border-color: #cbd5e1;
      color: #64748b;
      cursor: not-allowed;
    }
    .workspace-grid {
      display: grid;
      grid-template-columns: 260px 1fr 260px;
      gap: 14px;
      align-items: stretch;
    }
    @media (max-width: 820px) {
      .workspace-grid { grid-template-columns: 1fr 1fr; }
      .panel-center { grid-column: 1 / -1; order: 3; }
    }
    .panel-student {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: all 0.2s ease;
    }
    .panel-student.student-a.active {
      border-color: var(--staff-theme);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2);
    }
    .panel-student.student-b.active {
      border-color: var(--kelly-theme);
      box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.2);
    }
    .panel-student.disabled {
      opacity: 0.45;
    }
    .student-profile { display: flex; align-items: center; gap: 10px; }
    .avatar-circle {
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.15rem; color: #fff;
    }
    .student-a .avatar-circle { background: var(--staff-theme); }
    .student-b .avatar-circle { background: var(--kelly-theme); }
    .name-text { font-size: 1.05rem; font-weight: 800; }
    .turns-count { font-size: 0.72rem; font-weight: 700; color: #0284c7; }
    .student-b .turns-count { color: #e11d48; }

    .wait-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-size: 0.88rem;
      min-height: 76px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1.45;
      word-break: keep-all;
    }
    .wait-box strong { color: #0f172a; margin-top: 4px; }

    .btn-action-group { display: flex; flex-direction: column; gap: 8px; }
    .btn-speak {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      color: #fff;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
    }
    .student-a .btn-speak { background: var(--staff-theme); }
    .student-a .btn-speak:hover:not(:disabled) { background: var(--staff-hover); }

    .student-b .btn-speak { background: var(--kelly-theme); }
    .student-b .btn-speak:hover:not(:disabled) { background: var(--kelly-hover); }

    .btn-listen {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text-main);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-speak:disabled, .btn-listen:disabled {
      background: #cbd5e1 !important;
      border-color: #cbd5e1 !important;
      cursor: not-allowed;
      color: #94a3b8;
    }
    .btn-speak.recognizing {
      background: #ea580c !important;
    }

    details.manual-input {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.8rem;
    }
    details summary { cursor: pointer; font-weight: 700; color: var(--text-muted); }
    .manual-box { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
    textarea.txt-student {
      width: 100%;
      height: 52px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 0.82rem;
      resize: none;
    }
    .btn-confirm {
      padding: 6px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #f1f5f9;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .panel-center {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
    }
    .chat-header-bar {
      background: var(--chat-header);
      color: #ffffff;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      font-weight: 800;
    }
    .chat-progress-tag {
      background: rgba(255, 255, 255, 0.2);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
    }
    .chat-window {
      background: var(--chat-bg);
      height: 520px;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .chat-bubble { max-width: 82%; display: flex; flex-direction: column; }
    .chat-bubble.speaker-staff { align-self: flex-start; }
    .chat-bubble.speaker-staff .bubble-box {
      background: var(--staff-bubble);
      border-radius: 4px 14px 14px 14px;
      color: #0f172a;
    }
    .chat-bubble.speaker-kelly { align-self: flex-end; }
    .chat-bubble.speaker-kelly .bubble-box {
      background: var(--kelly-bubble);
      border-radius: 14px 4px 14px 14px;
      color: #191919;
    }
    .bubble-speaker-tag {
      font-size: 0.72rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 3px;
    }
    .speaker-kelly .bubble-speaker-tag { text-align: right; }
    .bubble-box {
      padding: 10px 14px;
      line-height: 1.48;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
    }
    .chat-bubble[data-current="true"] .bubble-box {
      box-shadow: 0 0 0 2.5px #0284c7, 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    .bubble-target { font-size: 0.95rem; font-weight: 700; word-break: keep-all; }
    .bubble-user-text {
      font-size: 0.85rem;
      margin-top: 5px;
      padding-top: 5px;
      border-top: 1px dashed rgba(0, 0, 0, 0.18);
      color: #334155;
    }
    .feedback-mark {
      display: inline-block;
      align-self: flex-start;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 3px;
    }
    .speaker-kelly .feedback-mark { align-self: flex-end; }
    .mark-O { background: #dcfce7; color: #15803d; }
    .mark-triangle { background: #fef3c7; color: #b45309; }
    .mark-X { background: #fee2e2; color: #b91c1c; }
    .chat-status-bar {
      background: #ffffff;
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #334155;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }
    .modal-content {
      background: #ffffff;
      width: 100%;
      max-width: 380px;
      border-radius: 18px;
      padding: 24px 20px;
      text-align: center;
    }
    .qr-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      background: #ffffff;
      border: 2px solid #0f172a;
      border-radius: 14px;
      margin: 12px auto;
      width: 240px;
      height: 240px;
    }
    .qr-container img { width: 100%; height: 100%; object-fit: contain; }
    .btn-modal-close {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="top-header">
      <div class="badge-wrap">
        <span class="badge-unit">2B 17과 말하기2</span>
        <h1 class="title-main">직원과 켈리의 대화 (2인 롤플레잉)</h1>
      </div>
      <div class="header-right">
        <button type="button" class="btn-qr-action" id="btnOpenQr">📱 QR코드</button>
      </div>
    </header>

    <div class="scenario-selector">
      <button type="button" class="btn-scenario active" id="btnScen1">1) 지하철 2호선 / 까만색 배낭 (기본)</button>
      <button type="button" class="btn-scenario" id="btnScen2">2) 서울대입구역 화장실 / 파란색 배낭 (치환)</button>
    </div>

    <div class="guide-bar">
      <span>💡 두 학생이 번갈아 가며 대사를 말합니다. 발화 후 [다음 차례 ➔]를 누르세요.</span>
      <button type="button" class="btn-turn-flow" id="btnTurnFlow" disabled>다음 차례 ➔</button>
    </div>

    <div class="workspace-grid">
      <!-- 왼쪽: 직원 -->
      <section class="panel-student student-a" id="panelStaff">
        <div class="student-profile">
          <div class="avatar-circle">직</div>
          <div>
            <div class="name-text">학생 A (직원)</div>
            <div class="turns-count">1·3·5·7·9·11회</div>
          </div>
        </div>

        <div class="wait-box" id="waitStaff">대기 중...</div>

        <div class="btn-action-group">
          <button type="button" class="btn-speak" id="btnMicStaff">🎤 직원 대사 말하기</button>
          <button type="button" class="btn-listen" id="btnListenStaff">🔊 발음 미리 듣기</button>
        </div>

        <details class="manual-input">
          <summary>직접 입력해서 말하기</summary>
          <div class="manual-box">
            <textarea class="txt-student" id="txtStaff" placeholder="대사를 입력하세요"></textarea>
            <button type="button" class="btn-confirm" id="btnConfirmStaff">입력 확인</button>
          </div>
        </details>
      </section>

      <!-- 중앙: 채팅창 -->
      <section class="panel-center">
        <div class="chat-header-bar">
          <span id="chatTitle">🎒 분실물 신고 대화 (기본)</span>
          <span class="chat-progress-tag" id="progressTag">현재 진행 1 / 11</span>
        </div>

        <div class="chat-window" id="chatWindow"></div>
        <div class="chat-status-bar" id="chatStatus">대화를 시작하세요.</div>
      </section>

      <!-- 오른쪽: 켈리 -->
      <section class="panel-student student-b" id="panelKelly">
        <div class="student-profile">
          <div class="avatar-circle">켈</div>
          <div>
            <div class="name-text">학생 B (켈리)</div>
            <div class="turns-count">2·4·6·8·10회</div>
          </div>
        </div>

        <div class="wait-box" id="waitKelly">대기 중...</div>

        <div class="btn-action-group">
          <button type="button" class="btn-speak" id="btnMicKelly">🎤 켈리 대사 말하기</button>
          <button type="button" class="btn-listen" id="btnListenKelly">🔊 발음 미리 듣기</button>
        </div>

        <details class="manual-input">
          <summary>직접 입력해서 말하기</summary>
          <div class="manual-box">
            <textarea class="txt-student" id="txtKelly" placeholder="대사를 입력하세요"></textarea>
            <button type="button" class="btn-confirm" id="btnConfirmKelly">입력 확인</button>
          </div>
        </details>
      </section>
    </div>

    <!-- QR 모달 -->
    <div class="modal" id="qrModal">
      <div class="modal-content">
        <h3 style="font-size:1.15rem; margin-bottom:4px;">📱 스마트폰 카메라로 스캔</h3>
        <p style="font-size:0.82rem; color:#64748b;">화면의 QR 코드를 비추면 연습 페이지가 열립니다.</p>
        <div class="qr-container">
          <img id="qrImg" src="" alt="QR코드" />
        </div>
        <button type="button" class="btn-modal-close" id="btnCloseQr">닫기</button>
      </div>
    </div>
  </div>

  <script>
    // 1) 기본 대화 (지하철 2호선에 놓고 내리다 / 까만색 / 하얀색 인형이 달려 있다 / 책 두 권하고 지갑)
    var SCENARIO_1 = [
      { speaker: '직원', target: '어떻게 오셨습니까?' },
      { speaker: '켈리', target: '가방을 잃어버려서 왔는데요.' },
      { speaker: '직원', target: '어디서 잃어버리셨습니까?' },
      { speaker: '켈리', target: '오늘 아침에 지하철 2호선에 놓고 내렸어요.' },
      { speaker: '직원', target: '가방이 어떻게 생겼습니까?' },
      { speaker: '켈리', target: '까만색 배낭인데 하얀색 인형이 달려 있어요.' },
      { speaker: '직원', target: '가방 안에 뭐가 들어 있습니까?' },
      { speaker: '켈리', target: '책 두 권하고 지갑이 들어 있어요.' },
      { speaker: '직원', target: '잠깐만요. 그런 가방은 없는데요.' },
      { speaker: '켈리', target: '그래요? 꼭 찾아야 하는데 큰일 났네요.' },
      { speaker: '직원', target: '찾으면 연락 드릴 테니까 여기에 전화번호를 써 놓고 가세요.' }
    ];

    // 2) 치환 대화 (서울대입구역 화장실에 두고 나오다 / 파란색 / 이름표가 붙어 있다 / 지갑이랑 수첩)
    var SCENARIO_2 = [
      { speaker: '직원', target: '어떻게 오셨습니까?' },
      { speaker: '켈리', target: '가방을 잃어버려서 왔는데요.' },
      { speaker: '직원', target: '어디서 잃어버리셨습니까?' },
      { speaker: '켈리', target: '오늘 아침에 서울대입구역 화장실에 두고 나왔어요.' },
      { speaker: '직원', target: '가방이 어떻게 생겼습니까?' },
      { speaker: '켈리', target: '파란색 배낭인데 이름표가 붙어 있어요.' },
      { speaker: '직원', target: '가방 안에 뭐가 들어 있습니까?' },
      { speaker: '켈리', target: '지갑이랑 수첩이 들어 있어요.' },
      { speaker: '직원', target: '잠깐만요. 그런 가방은 없는데요.' },
      { speaker: '켈리', target: '그래요? 꼭 찾아야 하는데 큰일 났네요.' },
      { speaker: '직원', target: '찾으면 연락 드릴 테니까 여기에 전화번호를 써 놓고 가세요.' }
    ];

    var currentDialogue = SCENARIO_1;
    var turn = 0;
    var responses = ['', '', '', '', '', '', '', '', '', '', ''];
    var scores = [null, null, null, null, null, null, null, null, null, null, null];
    var completed = false;
    var recognition = null;
    var activeRole = null;

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR';
      u.rate = 0.88;
      window.speechSynthesis.speak(u);
    }

    function initRecognition() {
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return;
      try {
        recognition = new SR();
        recognition.lang = 'ko-KR';
        recognition.onstart = function() {
          var btn = activeRole === '직원' ? document.getElementById('btnMicStaff') : document.getElementById('btnMicKelly');
          if (btn) {
            btn.classList.add('recognizing');
            btn.textContent = '🔴 듣는 중... 말씀하세요';
          }
        };
        recognition.onresult = function(e) {
          var text = e.results[0][0].transcript;
          if (text && activeRole) {
            commitSpoken(activeRole, text);
          }
        };
        recognition.onend = function() {
          var b1 = document.getElementById('btnMicStaff');
          var b2 = document.getElementById('btnMicKelly');
          if (b1) { b1.classList.remove('recognizing'); b1.textContent = '🎤 직원 대사 말하기'; }
          if (b2) { b2.classList.remove('recognizing'); b2.textContent = '🎤 켈리 대사 말하기'; }
          activeRole = null;
        };
      } catch(e) {
        console.warn('음성인식 미지원');
      }
    }

    function commitSpoken(speaker, text) {
      if (completed) return;
      var cur = currentDialogue[turn];
      if (cur.speaker !== speaker) return;

      var clean = function(s) { return (s || '').replace(/[\s.,?!]/g, ''); };
      var t = clean(cur.target);
      var s = clean(text);

      var match = 0;
      for (var i = 0; i < Math.min(t.length, s.length); i++) {
        if (t[i] === s[i]) match++;
      }
      var score = Math.floor((match / Math.max(t.length, s.length)) * 100);

      responses[turn] = text;
      scores[turn] = score;

      renderChat();
      updateControls();
    }

    function renderChat() {
      var win = document.getElementById('chatWindow');
      if (!win) return;
      win.innerHTML = '';

      for (var idx = 0; idx < currentDialogue.length; idx++) {
        var item = currentDialogue[idx];
        var isStaff = item.speaker === '직원';
        var isCurrent = !completed && idx === turn;

        var bubble = document.createElement('div');
        bubble.className = 'chat-bubble speaker-' + (isStaff ? 'staff' : 'kelly');
        bubble.setAttribute('data-current', isCurrent ? 'true' : 'false');

        var markHtml = '';
        if (scores[idx] !== null) {
          var mChar = 'X';
          var mCls = 'mark-X';
          if (scores[idx] >= 85) { mChar = 'O'; mCls = 'mark-O'; }
          else if (scores[idx] >= 65) { mChar = '△'; mCls = 'mark-triangle'; }
          markHtml = '<span class="feedback-mark ' + mCls + '">' + mChar + ' (' + scores[idx] + '점)</span>';
        }

        var userHtml = responses[idx] ? '<div class="bubble-user-text">🗣️ 발화: ' + responses[idx] + '</div>' : '';

        bubble.innerHTML = 
          '<div class="bubble-speaker-tag">' + item.speaker + '</div>' +
          markHtml +
          '<div class="bubble-box">' +
            '<div class="bubble-target">' + item.target + '</div>' +
            userHtml +
          '</div>';

        win.appendChild(bubble);
      }
    }

    function updateControls() {
      var pStaff = document.getElementById('panelStaff');
      var pKelly = document.getElementById('panelKelly');
      var btnMicStaff = document.getElementById('btnMicStaff');
      var btnListenStaff = document.getElementById('btnListenStaff');
      var btnMicKelly = document.getElementById('btnMicKelly');
      var btnListenKelly = document.getElementById('btnListenKelly');
      var waitStaff = document.getElementById('waitStaff');
      var waitKelly = document.getElementById('waitKelly');
      var btnTurn = document.getElementById('btnTurnFlow');
      var prog = document.getElementById('progressTag');
      var status = document.getElementById('chatStatus');

      prog.textContent = '현재 진행 ' + (turn + 1) + ' / 11';

      if (completed) {
        pStaff.className = 'panel-student student-a disabled';
        pKelly.className = 'panel-student student-b disabled';
        btnMicStaff.disabled = true;
        btnListenStaff.disabled = true;
        btnMicKelly.disabled = true;
        btnListenKelly.disabled = true;
        waitStaff.textContent = '모든 대화가 완료되었습니다.';
        waitKelly.textContent = '모든 대화가 완료되었습니다!';
        btnTurn.textContent = '처음부터 다시';
        btnTurn.disabled = false;
        status.textContent = '🎉 11개 대화를 모두 마쳤습니다! 훌륭합니다.';
        return;
      }

      var current = currentDialogue[turn];
      var isStaff = current.speaker === '직원';

      pStaff.className = 'panel-student student-a ' + (isStaff ? 'active' : 'disabled');
      pKelly.className = 'panel-student student-b ' + (!isStaff ? 'active' : 'disabled');

      btnMicStaff.disabled = !isStaff;
      btnListenStaff.disabled = !isStaff;
      btnMicKelly.disabled = isStaff;
      btnListenKelly.disabled = isStaff;

      if (isStaff) {
        waitStaff.innerHTML = '말할 대사:<br><strong>"' + current.target + '"</strong>';
        waitKelly.textContent = '직원의 말을 듣고 차례를 기다리세요.';
      } else {
        waitKelly.innerHTML = '말할 대사:<br><strong>"' + current.target + '"</strong>';
        waitStaff.textContent = '켈리의 대답을 기다리고 있습니다.';
      }

      btnTurn.disabled = !responses[turn];
      btnTurn.textContent = (turn === 10) ? '대화 마치기' : '다음 차례 ➔';
      status.textContent = current.speaker + ' 차례입니다. [대사 말하기] 또는 직접 입력해 보세요.';
    }

    function resetAll() {
      turn = 0;
      responses = ['', '', '', '', '', '', '', '', '', '', ''];
      scores = [null, null, null, null, null, null, null, null, null, null, null];
      completed = false;
      renderChat();
      updateControls();
    }

    function setupEvents() {
      initRecognition();
      renderChat();
      updateControls();

      document.getElementById('btnScen1').onclick = function() {
        currentDialogue = SCENARIO_1;
        document.getElementById('btnScen1').className = 'btn-scenario active';
        document.getElementById('btnScen2').className = 'btn-scenario';
        document.getElementById('chatTitle').textContent = '🎒 분실물 신고 대화 (기본)';
        resetAll();
      };

      document.getElementById('btnScen2').onclick = function() {
        currentDialogue = SCENARIO_2;
        document.getElementById('btnScen2').className = 'btn-scenario active';
        document.getElementById('btnScen1').className = 'btn-scenario';
        document.getElementById('chatTitle').textContent = '🎒 분실물 신고 대화 (치환)';
        resetAll();
      };

      document.getElementById('btnListenStaff').onclick = function() {
        if (currentDialogue[turn].speaker === '직원') speakText(currentDialogue[turn].target);
      };
      document.getElementById('btnListenKelly').onclick = function() {
        if (currentDialogue[turn].speaker === '켈리') speakText(currentDialogue[turn].target);
      };

      document.getElementById('btnMicStaff').onclick = function() {
        if (recognition) { activeRole = '직원'; recognition.start(); }
      };
      document.getElementById('btnMicKelly').onclick = function() {
        if (recognition) { activeRole = '켈리'; recognition.start(); }
      };

      document.getElementById('btnConfirmStaff').onclick = function() {
        var txt = document.getElementById('txtStaff').value;
        commitSpoken('직원', txt);
      };
      document.getElementById('btnConfirmKelly').onclick = function() {
        var txt = document.getElementById('txtKelly').value;
        commitSpoken('켈리', txt);
      };

      document.getElementById('btnTurnFlow').onclick = function() {
        if (completed) { resetAll(); return; }
        if (turn < 10) { turn++; } else { completed = true; }
        renderChat();
        updateControls();
      };

      var qrModal = document.getElementById('qrModal');
      document.getElementById('btnOpenQr').onclick = function() {
        var targetUrl = window.location.href.startsWith('http') 
          ? window.location.href 
          : 'https://thigp3.github.io/2A-2B/2b-17-2.html';
        var currentUrl = encodeURIComponent(targetUrl);
        var qrImg = document.getElementById('qrImg');
        qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=' + currentUrl;
        qrModal.style.display = 'flex';
      };
      document.getElementById('btnCloseQr').onclick = function() {
        qrModal.style.display = 'none';
      };
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', setupEvents);
    } else {
      setupEvents();
    }
  </script>
</body>
</html>
