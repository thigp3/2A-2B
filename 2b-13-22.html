<!DOCTYPE html>
<html lang="ko">
<head>

    :root {

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {

    .top-header {

      align-items: center;
      padding: 4px 6px;

    .badge-wrap { display: flex; align-items: center; gap: 8px; }

    }

    .btn-qr-action {

      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
    }
    .scenario-selector {
      display: flex;
      gap: 8px;
      background: #ffffff;
      padding: 6px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
    }
    .btn-scenario {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
    }
    .btn-scenario.active {

      color: #ffffff;
    }
    .guide-bar {

      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .btn-turn-flow {
      padding: 7px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: #ffffff;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-turn-flow:disabled {
      background: #cbd5e1;
      border-color: #cbd5e1;
      color: #64748b;
      cursor: not-allowed;
    }
    .workspace-grid {
      display: grid;
      grid-template-columns: 260px 1fr 260px;
      gap: 14px;
      align-items: stretch;
    }
    @media (max-width: 820px) {
      .workspace-grid { grid-template-columns: 1fr 1fr; }
      .panel-center { grid-column: 1 / -1; order: 3; }
    }
    .panel-student {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: all 0.2s ease;
    }
    .panel-student.student-a.active {
      border-color: var(--broker-theme);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2);
    }
    .panel-student.student-b.active {

      box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.2);
    }
    .panel-student.disabled {
      opacity: 0.45;
    }
    .student-profile { display: flex; align-items: center; gap: 10px; }
    .avatar-circle {

      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.15rem; color: #fff;
    }
    .student-a .avatar-circle { background: var(--broker-theme); }
    .student-b .avatar-circle { background: var(--akira-theme); }
    .name-text { font-size: 1.05rem; font-weight: 800; }
    .turns-count { font-size: 0.72rem; font-weight: 700; color: #0284c7; }
    .student-b .turns-count { color: #e11d48; }

    .wait-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-size: 0.88rem;
      min-height: 76px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1.45;
      word-break: keep-all;
    }
    .wait-box strong { color: #0f172a; margin-top: 4px; }

    .btn-action-group { display: flex; flex-direction: column; gap: 8px; }

      padding: 12px;
      border-radius: 10px;
      border: none;
      color: #fff;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
    }
    .student-a .btn-speak { background: var(--broker-theme); }
    .student-b .btn-speak { background: var(--akira-theme); }
