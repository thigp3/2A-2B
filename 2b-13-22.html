    :root {

      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 14px;
      overflow-x: hidden;

    .app-container {
      width: 100%;

      gap: 12px;

      background: transparent;

      text-align: center;

      background: #0f172a;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);

      padding: 10px 16px;

    }

    .btn-turn-flow {

      border-radius: 8px;

      background: #f1f5f9;
      font-size: 0.84rem;

      cursor: pointer;
      color: var(--text-main);
      transition: all 0.2s;
    }
    .btn-turn-flow:not(:disabled) {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }
    .btn-turn-flow:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .workspace-grid {

      gap: 14px;
      align-items: stretch;
    }

    @media (max-width: 820px) {
      .workspace-grid {
        grid-template-columns: 1fr 1fr;
      }
      .panel-center {
        grid-column: 1 / -1;
        order: 3;
      }
    }

    .panel-student {

      padding: 16px;

      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: all 0.25s ease;
    }

    .panel-student.student-a.active {
      border-color: var(--broker-theme);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2);
    }
    .panel-student.student-b.active {

      align-items: center;
      justify-content: center;

    .student-b .avatar-circle { background: var(--akira-theme); }

    .name-text { font-size: 1.05rem; font-weight: 800; }
    .turns-count { font-size: 0.72rem; font-weight: 700; color: #0284c7; }
    .student-b .turns-count { color: #e11d48; }

    .wait-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-size: 0.88rem;
      color: var(--text-main);
      min-height: 70px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1.45;
      word-break: keep-all;
    }
    .wait-box strong { color: #0f172a; margin-top: 4px; }

    .btn-action-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-speak {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      color: #fff;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
    }
    .student-a .btn-speak { background: var(--broker-theme); }
    .student-a .btn-speak:hover:not(:disabled) { background: var(--broker-hover); }

    .student-b .btn-speak { background: var(--akira-theme); }
    .student-b .btn-speak:hover:not(:disabled) { background: var(--akira-hover); }

    .btn-listen {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text-main);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-speak:disabled, .btn-listen:disabled {
      background: #cbd5e1 !important;
      border-color: #cbd5e1 !important;
      cursor: not-allowed;
      color: #94a3b8;
    }
    .btn-speak.recognizing {
      background: #ea580c !important;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.75; }
    }

    details.manual-input {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.8rem;
    }
