<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2B 13과 말하기2 | 부동산에서 방 구하기</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg-page: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --broker-theme: #0284c7;
      --broker-hover: #0369a1;
      --broker-bubble: #ffffff;
      --akira-theme: #e11d48;
      --akira-hover: #be123c;
      --akira-bubble: #fef01b;
      --chat-bg: #a3bad2;
      --chat-header: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 14px;
      overflow-x: hidden;
    }
    .app-container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
    }
    .badge-wrap { display: flex; align-items: center; gap: 8px; }
    .badge-unit {
      background: #fef3c7;
      color: #b45309;
      font-size: 0.85rem;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid #fde68a;
    }
    .title-main { font-size: 1.15rem; font-weight: 800; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .btn-qr-action {
      background: #fef3c7;
      border: 1px solid #fde68a;
      color: #92400e;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
    }
    .scenario-selector {
      display: flex;
      gap: 8px;
      background: #ffffff;
      padding: 6px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
    }
    .btn-scenario {
      flex: 1;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text-muted);
      cursor: pointer;
    }
    .btn-scenario.active {
      background: #0f172a;
      color: #ffffff;
    }
    .guide-bar {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .btn-turn-flow {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: #ffffff;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-turn-flow:disabled { opacity: 0.4; cursor: not-allowed; }
    .workspace-grid {
      display: grid;
      grid-template-columns: 260px 1fr 260px;
      gap: 14px;
    }
    @media (max-width: 820px) {
      .workspace-grid { grid-template-columns: 1fr 1fr; }
      .panel-center { grid-column: 1 / -1; order: 3; }
    }
    .panel-student {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }
    .panel-student.student-a.active { border-color: var(--broker-theme); }
    .panel-student.student-b.active { border-color: var(--akira-theme); }
    .panel-student.disabled { opacity: 0.5; }
    .student-profile { display: flex; align-items: center; gap: 10px; }
    .avatar-circle {
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.15rem; color: #fff;
    }
    .student-a .avatar-circle { background: var(--broker-theme); }
    .student-b .avatar-circle { background: var(--akira-theme); }
    .wait-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-size: 0.84rem;
      min-height: 58px;
      display: flex;
      align-items: center;
    }
    .btn-speak {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }
    .student-a .btn-speak { background: var(--broker-theme); }
    .student-b .btn-speak { background: var(--akira-theme); }
    .btn-speak:disabled, .btn-listen:disabled { background: #cbd5e1 !important; cursor: not-allowed; }
    .btn-listen {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }
    .panel-center {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-header-bar {
      background: var(--chat-header);
      color: #fff;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      font-size: 0.88rem;
      font-weight: 800;
    }
    .chat-window {
      background: var(--chat-bg);
      height: 520px;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .chat-bubble { max-width: 82%; display: flex; flex-direction: column; }
    .chat-bubble.speaker-broker { align-self: flex-start; }
    .chat-bubble.speaker-broker .bubble-box { background: var(--broker-bubble); border-radius: 4px 14px 14px 14px; color: #0f172a; }
    .chat-bubble.speaker-akira { align-self: flex-end; }
    .chat-bubble.speaker-akira .bubble-box { background: var(--akira-bubble); border-radius: 14px 4px 14px 14px; color: #191919; }
    .bubble-speaker-tag { font-size: 0.72rem; font-weight: 700; margin-bottom: 3px; }
    .speaker-akira .bubble-speaker-tag { text-align: right; }
    .bubble-box { padding: 10px 14px; line-height: 1.48; box-shadow: 0 1px 2px rgba(0,0,0,0.12); }
    .bubble-target { font-size: 0.95rem; font-weight: 700; }
    .bubble-user-text { font-size: 0.85rem; margin-top: 4px; padding-top: 4px; border-top: 1px dashed rgba(0,0,0,0.15); color: #334155; }
    .feedback-mark {
      font-size: 0.78rem; font-weight: 800; padding: 2px 8px; border-radius: 4px; margin-bottom: 3px; align-self: flex-start;
    }
    .speaker-akira .feedback-mark { align-self: flex-end; }
    .mark-O { background: #dcfce7; color: #15803d; }
    .mark-triangle { background: #fef3c7; color: #b45309; }
    .mark-X { background: #fee2e2; color: #b91c1c; }
    .chat-status-bar { background: #fff; border-top: 1px solid var(--border); padding: 10px 14px; font-size: 0.85rem; font-weight: 700; }
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      align-items: center; justify-content: center; z-index: 1000;
    }
    .modal-content {
      background: #fff; width: 100%; max-width: 360px; border-radius: 16px; padding: 20px; text-align: center;
    }
    .qr-container { display: flex; justify-content: center; margin: 12px auto; width: 230px; height: 230px; }
    .btn-modal-close {
      width: 100%; padding: 10px; border-radius: 8px; border: none; background: #0f172a; color: #fff; font-weight: 800; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="top-header">
      <div class="badge-wrap">
        <span class="badge-unit">2B 13과 말하기2</span>
        <h1 class="title-main">중개인과 아키라의 대화 (2인 롤플레잉)</h1>
      </div>
      <div class="header-right">
        <button type="button" class="btn-qr-action" id="btnOpenQr">📱 QR코드</button>
      </div>
    </header>

    <div class="scenario-selector">
      <button type="button" class="btn-scenario active" id="btnScen1">1) 집 계약 끝나다 / 주변 조용하다 (기본)</button>
      <button type="button" class="btn-scenario" id="btnScen2">2) 회사 옮기다 / 장 보기 편하다 (치환)</button>
    </div>

    <div class="guide-bar">
      <span>💡 두 학생이 번갈아 가며 대사를 말합니다.</span>
      <button type="button" class="btn-turn-flow" id="btnTurnFlow" disabled>다음 차례 ➔</button>
    </div>

    <div class="workspace-grid">
      <section class="panel-student student-a" id="panelBroker">
        <div class="student-profile">
          <div class="avatar-circle">중</div>
          <div>
            <div style="font-weight:800;">학생 A (중개인)</div>
            <div style="font-size:0.75rem; color:#64748b;">1·3·5·7·9회</div>
          </div>
        </div>
        <div class="wait-box" id="waitBroker">대기 중...</div>
        <div>
          <button type="button" class="btn-speak" id="btnMicBroker">🎤 중개인 대사 말하기</button>
          <button type="button" class="btn-listen" id="btnListenBroker">🔊 발음 미리 듣기</button>
        </div>
      </section>

      <section class="panel-center">
        <div class="chat-header-bar">
          <span id="chatTitle">🏠 부동산에서 원룸 구하기</span>
          <span id="progressTag">1 / 10</span>
        </div>
        <div class="chat-window" id="chatWindow"></div>
        <div class="chat-status-bar" id="chatStatus">대화를 시작하세요.</div>
      </section>

      <section class="panel-student student-b" id="panelAkira">
        <div class="student-profile">
          <div class="avatar-circle">아</div>
          <div>
            <div style="font-weight:800;">학생 B (아키라)</div>
            <div style="font-size:0.75rem; color:#64748b;">2·4·6·8·10회</div>
          </div>
        </div>
        <div class="wait-box" id="waitAkira">대기 중...</div>
        <div>
          <button type="button" class="btn-speak" id="btnMicAkira">🎤 아키라 대사 말하기</button>
          <button type="button" class="btn-listen" id="btnListenAkira">🔊 발음 미리 듣기</button>
        </div>
      </section>
    </div>

    <div class="modal" id="qrModal">
      <div class="modal-content">
        <h3 style="margin-bottom:8px;">📱 스마트폰으로 스캔</h3>
        <div class="qr-container"><div id="qrcode"></div></div>
        <button type="button" class="btn-modal-close" id="btnCloseQr">닫기</button>
      </div>
    </div>
  </div>
