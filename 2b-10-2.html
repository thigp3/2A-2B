<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2B 10과 말하기2 | 정우와 스티븐의 식당 대화</title>
  <style>
    :root {
      --bg-page: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --jungwoo-theme: #0284c7;
      --jungwoo-hover: #0369a1;
      --jungwoo-bubble: #ffffff;
      --steven-theme: #e11d48;
      --steven-hover: #be123c;
      --steven-bubble: #fef01b;
      --chat-bg: #a3bad2;
      --chat-header: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 14px;
      overflow-x: hidden;
    }
    .app-container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
    }
    .badge-wrap { display: flex; align-items: center; gap: 8px; }
    .badge-unit {
      background: #fef3c7;
      color: #b45309;
      font-size: 0.88rem;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid #fde68a;
    }
    .title-main { font-size: 1.15rem; font-weight: 800; }
    .btn-qr-action {
      background: #fef3c7;
      border: 1px solid #fde68a;
      color: #92400e;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
    }
    .scenario-selector {
      display: flex;
      gap: 8px;
      background: #ffffff;
      padding: 6px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
    }
    .btn-scenario {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
    }
    .btn-scenario.active {
      background: #0f172a;
      color: #ffffff;
    }
    .guide-bar {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .btn-turn-flow {
      padding: 7px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: #ffffff;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-turn-flow:disabled {
      background: #cbd5e1;
      border-color: #cbd5e1;
      color: #64748b;
      cursor: not-allowed;
    }
    .workspace-grid {
      display: grid;
      grid-template-columns: 260px 1fr 260px;
      gap: 14px;
      align-items: stretch;
    }
    @media (max-width: 820px) {
      .workspace-grid { grid-template-columns: 1fr 1fr; }
      .panel-center { grid-column: 1 / -1; order: 3; }
    }
    .panel-student {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: all 0.2s ease;
    }
    .panel-student.student-a.active {
      border-color: var(--jungwoo-theme);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2);
    }
    .panel-student.student-b.active {
      border-color: var(--steven-theme);
      box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.2);
    }
    .panel-student.disabled {
      opacity: 0.45;
    }
    .student-profile { display: flex; align-items: center; gap: 10px; }
    .avatar-circle {
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.15rem; color: #fff;
    }
    .student-a .avatar-circle { background: var(--jungwoo-theme); }
    .student-b .avatar-circle { background: var(--steven-theme); }
    .name-text { font-size: 1.05rem; font-weight: 800; }
    .turns-count { font-size: 0.72rem; font-weight: 700; color: #0284c7; }
    .student-b .turns-count { color: #e11d48; }

    .wait-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-size: 0.88rem;
      min-height: 76px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1.45;
      word-break: keep-all;
    }
    .wait-box strong { color: #0f172a; margin-top: 4px; }

    .btn-action-group { display: flex; flex-direction: column; gap: 8px; }
    .btn-speak {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      color: #fff;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
    }
    .student-a .btn-speak { background: var(--jungwoo-theme); }
    .student-a .btn-speak:hover:not(:disabled) { background: var(--jungwoo-hover); }

    .student-b .btn-speak { background: var(--steven-theme); }
    .student-b .btn-speak:hover:not(:disabled) { background: var(--steven-hover); }

    .btn-listen {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text-main);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-speak:disabled, .btn-listen:disabled {
      background: #cbd5e1 !important;
      border-color: #cbd5e1 !important;
      cursor: not-allowed;
      color: #94a3b8;
    }
    .btn-speak.recognizing {
      background: #ea580c !important;
    }

    details.manual-input {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.8rem;
    }
    details summary { cursor: pointer; font-weight: 700; color: var(--text-muted); }
    .manual-box { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
    textarea.txt-student {
      width: 100%;
      height: 52px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 0.82rem;
      resize: none;
    }
    .btn-confirm {
      padding: 6px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #f1f5f9;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .panel-center {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
    }
    .chat-header-bar {
      background: var(--chat-header);
      color: #ffffff;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      font-weight: 800;
    }
    .chat-progress-tag {
      background: rgba(255, 255, 255, 0.2);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
    }
    .chat-window {
      background: var(--chat-bg);
      height: 520px;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .chat-bubble { max-width: 82%; display: flex; flex-direction: column; }
    .chat-bubble.speaker-jungwoo { align-self: flex-start; }
    .chat-bubble.speaker-jungwoo .bubble-box {
      background: var(--jungwoo-bubble);
      border-radius: 4px 14px 14px 14px;
      color: #0f172a;
    }
    .chat-bubble.speaker-steven { align-self: flex-end; }
    .chat-bubble.speaker-steven .bubble-box {
      background: var(--steven-bubble);
      border-radius: 14px 4px 14px 14px;
      color: #191919;
    }
    .bubble-speaker-tag {
      font-size: 0.72rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 3px;
    }
    .speaker-steven .bubble-speaker-tag { text-align: right; }
    .bubble-box {
      padding: 10px 14px;
      line-height: 1.48;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
    }
    .chat-bubble[data-current="true"] .bubble-box {
      box-shadow: 0 0 0 2.5px #0284c7, 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    .bubble-target { font-size: 0.95rem; font-weight: 700; word-break: keep-all; }
    .bubble-user-text {
      font-size: 0.85rem;
      margin-top: 5px;
      padding-top: 5px;
      border-top: 1px dashed rgba(0, 0, 0, 0.18);
      color: #334155;
    }
    .feedback-mark {
      display: inline-block;
      align-self: flex-start;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 3px;
    }
    .speaker-steven .feedback-mark { align-self: flex-end; }
    .mark-O { background: #dcfce7; color: #15803d; }
    .mark-triangle { background: #fef3c7; color: #b45309; }
    .mark-X { background: #fee2e2; color: #b91c1c; }
    .chat-status-bar {
      background: #ffffff;
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #334155;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }
    .modal-content {
      background: #ffffff;
      width: 100%;
      max-width: 380px;
      border-radius: 18px;
      padding: 24px 20px;
      text-align: center;
    }
    .qr-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      background: #ffffff;
      border: 2px solid #0f172a;
      border-radius: 14px;
      margin: 12px auto;
      width: 240px;
      height: 240px;
    }
    .qr-container img { width: 100%; height: 100%; object-fit: contain; }
    .btn-modal-close {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="top-header">
      <div class="badge-wrap">
        <span class="badge-unit">2B 10과 말하기2</span>
        <h1 class="title-main">정우와 스티븐의 식당 대화 (2인 롤플레잉)</h1>
      </div>
      <div class="header-right">
        <button type="button" class="btn-qr-action" id="btnOpenQr">📱 QR코드</button>
      </div>
    </header>

    <div class="scenario-selector">
      <button type="button" class="btn-scenario active" id="btnScen1">1) 삼계탕 / 감자탕 (기본)</button>
      <button type="button" class="btn-scenario" id="btnScen2">2) 생선회 / 매운탕 (치환)</button>
    </div>

    <div class="guide-bar">
      <span>💡 두 학생이 번갈아 가며 대사를 말합니다. 발화 후 [다음 차례 ➔]를 누르세요.</span>
      <button type="button" class="btn-turn-flow" id="btnTurnFlow" disabled>다음 차례 ➔</button>
    </div>

    <div class="workspace-grid">
      <!-- 왼쪽: 정우 -->
      <section class="panel-student student-a" id="panelJungwoo">
        <div class="student-profile">
          <div class="avatar-circle">정</div>
          <div>
            <div class="name-text">학생 A (정우)</div>
            <div class="turns-count">1·3·5·7·8회</div>
          </div>
        </div>

        <div class="wait-box" id="waitJungwoo">대기 중...</div>

        <div class="btn-action-group">
          <button type="button" class="btn-speak" id="btnMicJungwoo">🎤 정우 대사 말하기</button>
          <button type="button" class="btn-listen" id="btnListenJungwoo">🔊 발음 미리 듣기</button>
        </div>

        <details class="manual-input">
          <summary>직접 입력해서 말하기</summary>
          <div class="manual-box">
            <textarea class="txt-student" id="txtJungwoo" placeholder="대사를 입력하세요"></textarea>
            <button type="button" class="btn-confirm" id="btnConfirmJungwoo">입력 확인</button>
          </div>
        </details>
      </section>

      <!-- 중앙: 채팅창 -->
      <section class="panel-center">
        <div class="chat-header-bar">
          <span id="chatTitle">🍲 식당에서 메뉴 고르고 주문하기 (기본)</span>
          <span class="chat-progress-tag" id="progressTag">현재 진행 1 / 9</span>
        </div>

        <div class="chat-window" id="chatWindow"></div>
        <div class="chat-status-bar" id="chatStatus">대화를 시작하세요.</div>
      </section>

      <!-- 오른쪽: 스티븐 -->
      <section class="panel-student student-b" id="panelSteven">
        <div class="student-profile">
          <div class="avatar-circle">스</div>
          <div>
            <div class="name-text">학생 B (스티븐)</div>
            <div class="turns-count">2·4·6·9회</div>
          </div>
        </div>

        <div class="wait-box" id="waitSteven">대기 중...</div>

        <div
