<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2B 15과 말하기2 | 한국 생활 1인 연습</title>
  <style>
    :root {
      --bg-page: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --jungwoo-theme: #0284c7;
      --jungwoo-bubble: #ffffff;
      --hien-theme: #e11d48;
      --hien-bubble: #fef01b;
      --chat-bg: #a3bad2;
      --chat-header: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 14px;
      overflow-x: hidden;
    }
    .app-container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
    }
    .badge-wrap { display: flex; align-items: center; gap: 8px; }
    .badge-unit {
      background: #fef3c7;
      color: #b45309;
      font-size: 0.88rem;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid #fde68a;
    }
    .title-main { font-size: 1.15rem; font-weight: 800; }
    .btn-qr-action {
      background: #fef3c7;
      border: 1px solid #fde68a;
      color: #92400e;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
    }

    .scenario-selector {
      display: flex;
      gap: 8px;
      background: #ffffff;
      padding: 6px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
    }
    .btn-scenario {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
    }
    .btn-scenario.active {
      background: #0f172a;
      color: #ffffff;
    }

    .guide-bar {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .btn-turn-flow {
      padding: 7px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: #ffffff;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-turn-flow:disabled {
      background: #cbd5e1;
      border-color: #cbd5e1;
      color: #64748b;
      cursor: not-allowed;
    }

    .workspace-grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 14px;
      align-items: stretch;
    }
    @media (max-width: 768px) {
      .workspace-grid { grid-template-columns: 1fr; }
      .panel-solo-ctrl { order: 1; }
      .panel-center { order: 2; }
    }

    .panel-center {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
    }
    .chat-header-bar {
      background: var(--chat-header);
      color: #ffffff;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      font-weight: 800;
    }
    .chat-progress-tag {
      background: rgba(255, 255, 255, 0.2);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
    }
    .chat-window {
      background: var(--chat-bg);
      height: 540px;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .chat-bubble { max-width: 82%; display: flex; flex-direction: column; }
    .chat-bubble.speaker-jungwoo { align-self: flex-start; }
    .chat-bubble.speaker-jungwoo .bubble-box {
      background: var(--jungwoo-bubble);
      border-radius: 4px 14px 14px 14px;
      color: #0f172a;
    }
    .chat-bubble.speaker-hien { align-self: flex-end; }
    .chat-bubble.speaker-hien .bubble-box {
      background: var(--hien-bubble);
      border-radius: 14px 4px 14px 14px;
      color: #191919;
    }
    .bubble-speaker-tag {
      font-size: 0.72rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 3px;
    }
    .speaker-hien .bubble-speaker-tag { text-align: right; }
    .bubble-box {
      padding: 10px 14px;
      line-height: 1.48;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
    }
    .chat-bubble[data-current="true"] .bubble-box {
      box-shadow: 0 0 0 2.5px #0284c7, 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    .bubble-target { font-size: 0.95rem; font-weight: 700; word-break: keep-all; }
    .bubble-user-text {
      font-size: 0.85rem;
      margin-top: 5px;
      padding-top: 5px;
      border-top: 1px dashed rgba(0, 0, 0, 0.18);
      color: #334155;
    }
    .feedback-mark {
      display: inline-block;
      align-self: flex-start;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 3px;
    }
    .speaker-hien .feedback-mark { align-self: flex-end; }
    .mark-O { background: #dcfce7; color: #15803d; }
    .mark-triangle { background: #fef3c7; color: #b45309; }
    .mark-X { background: #fee2e2; color: #b91c1c; }
