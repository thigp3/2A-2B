<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2B 18과 말하기2 | 한국의 계절 1인 낭독 연습</title>
  <style>
    :root {
      --bg-page: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --primary-theme: #0d9488;
      --primary-hover: #0f766e;
      --chat-bg: #e2e8f0;
      --chat-header: #0f172a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 14px;
      overflow-x: hidden;
    }
    .app-container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
    }
    .badge-wrap { display: flex; align-items: center; gap: 8px; }
    .badge-unit {
      background: #fef3c7;
      color: #b45309;
      font-size: 0.88rem;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid #fde68a;
    }
    .title-main { font-size: 1.15rem; font-weight: 800; }
    .btn-qr-action {
      background: #fef3c7;
      border: 1px solid #fde68a;
      color: #92400e;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
    }

    .scenario-selector {
      display: flex;
      gap: 8px;
      background: #ffffff;
      padding: 6px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
    }
    .btn-scenario {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
    }
    .btn-scenario.active {
      background: var(--chat-header);
      color: #ffffff;
    }

    .guide-bar {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .btn-turn-flow {
      padding: 7px 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--chat-header);
      color: #ffffff;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-turn-flow:disabled {
      background: #cbd5e1;
      border-color: #cbd5e1;
      color: #64748b;
      cursor: not-allowed;
    }

    .workspace-grid {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 14px;
      align-items: stretch;
    }
    @media (max-width: 768px) {
      .workspace-grid { grid-template-columns: 1fr; }
      .panel-solo-ctrl { order: 1; }
      .panel-center { order: 2; }
    }

    .panel-center {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
    }
    .chat-header-bar {
      background: var(--chat-header);
      color: #ffffff;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      font-weight: 800;
    }
    .chat-progress-tag {
      background: rgba(255, 255, 255, 0.2);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
    }
    .text-scroll-window {
      background: var(--chat-bg);
      height: 540px;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .sentence-card {
      background: #ffffff;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .sentence-card[data-current="true"] {
      border-color: var(--primary-theme);
      box-shadow: 0 0 0 2.5px rgba(13, 148, 136, 0.25);
      background: #f0fdfa;
    }
    .card-top-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .num-tag {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-muted);
    }
    .target-sentence {
      font-size: 0.96rem;
      font-weight: 700;
      line-height: 1.5;
      color: #0f172a;
      word-break: keep-all;
    }
    .spoken-user-text {
      font-size: 0.85rem;
      margin-top: 4px;
      padding-top: 6px;
      border-top: 1px dashed rgba(0, 0, 0, 0.15);
      color: #334155;
    }
    .feedback-mark {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .mark-O { background: #dcfce7; color: #15803d; }
    .mark-triangle { background: #fef3c7; color: #b45309; }
    .mark-X { background: #fee2e2; color: #b91c1c; }

    .panel-solo-ctrl {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
    }
    .read-status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 800;
      color: #fff;
      background: var(--primary-theme);
      margin-bottom: 6px;
    }

    .current-prompt-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      min-height: 96px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }
    .prompt-label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); }
    .prompt-target { font-size: 0.98rem; font-weight: 800; color: #0f172a; word-break: keep-all; line-height: 1.45; }

    .btn-action-col { display: flex; flex-direction: column; gap: 8px; }
    .btn-speak-main {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: none;
      background: var(--primary-theme);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-speak-main:hover { background: var(--primary-hover); }
    .btn-speak-main.recognizing { background: #ea580c !important; }

    .btn-tts-listen {
      width: 100%;
      padding: 9px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text-main);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
    }

    details.manual-input {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.8rem;
    }
    details summary { cursor: pointer; font-weight: 700; color: var(--text-muted); }
    .manual-box { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
    textarea.txt-student {
      width: 100%;
      height: 56px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 0.82rem;
      resize: none;
    }
    .btn-confirm {
      padding: 7px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #f1f5f9;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }
    .modal-content {
      background: #ffffff;
      width: 100%;
      max-width: 380px;
      border-radius: 18px;
      padding: 24px 20px;
      text-align: center;
    }
    .qr-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      background: #ffffff;
      border: 2px solid #0f172a;
      border-radius: 14px;
      margin: 12px auto;
      width: 240px;
      height: 240px;
    }
    .qr-container img { width: 100%; height: 100%; object-fit: contain; }
    .btn-modal-close {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="top-header">
      <div class="badge-wrap">
        <span class="badge-unit">2B 18과 말하기2</span>
        <h1 class="title-main">한국의 계절 (1인 낭독 연습)</h1>
      </div>
      <div class="header-right">
        <button type="button" class="btn-qr-action" id="btnOpenQr">📱 QR코드</button>
      </div>
    </header>

    <div class="scenario-selector">
      <button type="button" class="btn-scenario active" id="btnScen1">1) 꽃 / 습도 / 단풍 / 눈 (기본)</button>
      <button type="button" class="btn-scenario" id="btnScen2">2) 바람 / 태풍 / 나뭇잎 / 얼음 (치환)</button>
    </div>

    <div class="guide-bar">
      <span>💡 문장을 소리 내어 또박또박 읽고 발음을 확인해 보세요.</span>
      <button type="button" class="btn-turn-flow" id="btnTurnFlow" disabled>다음 문장 ➔</button>
    </div>

    <div class="workspace-grid">
      <!-- 왼쪽 전체 낭독 목록 -->
      <section class="panel-center">
        <div class="chat-header-bar">
          <span id="readingTitle">🍂 한국의 계절 본문 읽기 (기본)</span>
          <span class="chat-progress-tag" id="progressTag">진행 1 / 13</span>
        </div>
        <div class="text-scroll-window" id="textWindow"></div>
      </section>

      <!-- 오른쪽 1인 낭독 조작 패널 -->
      <section class="panel-solo-ctrl">
        <div>
          <span class="read-status-badge" id="statusBadge">문장 1 낭독 중</span>
          <div class="current-prompt-box">
            <span class="prompt-label">소리 내어 읽을 문장:</span>
            <div class="prompt-target" id="promptTarget">시간이 참 빨리 지나간다.</div>
          </div>
        </div>

        <div class="btn-action-col">
          <button type="button" class="btn-speak-main" id="btnMic">🎤 음성으로 읽기</button>
          <button type="button" class="btn-tts-listen" id="btnListen">🔊 원어민 낭독 듣기</button>
        </div>

        <details class="manual-input">
          <summary>키보드로 직접 입력하기</summary>
          <div class="manual-box">
            <textarea class="txt-student" id="txtInput" placeholder="문장을 직접 입력해 보세요"></textarea>
            <button type="button" class="btn-confirm" id="btnConfirm">입력 확인</button>
          </div>
        </details>

        <button type="button" class="btn-confirm" id="btnReset" style="margin-top: 8px;">처음부터 다시 연습</button>
      </section>
    </div>

    <!-- QR 모달 -->
    <div class="modal" id="qrModal">
      <div class="modal-content">
        <h3 style="font-size:1.15rem; margin-bottom:4px;">📱 스마트폰 카메라로 스캔</h3>
        <p style="font-size:0.82rem; color:#64748b;">화면의 QR 코드를 비추면 연습 페이지가 열립니다.</p>
        <div class="qr-container">
          <img id="qrImg" src="" alt="QR코드" />
        </div>
        <button type="button" class="btn-modal-close" id="btnCloseQr">닫기</button>
      </div>
    </div>
  </div>

  <script>
    // 1) 기본 본문
    var PASSAGE_1 = [
      '시간이 참 빨리 지나간다.',
      '처음 한국에 왔을 때 겨울이었는데 지금은 봄, 여름이 지나고 가을이 되었다.',
      '한국의 계절은 우리 나라와 아주 다르다.',
      '우리 나라는 계절의 변화가 거의 없고 일 년 내내 따뜻한 편이다.',
      '하지만 한국은 사계절이 있다.',
      '한국은 봄에 날씨가 따뜻하고 꽃이 많이 핀다.',
      '여름에는 날씨가 매우 덥고 습도가 높다.',
      '또 장마가 있어서 비가 많이 온다.',
      '내가 제일 좋아하는 계절은 가을이다.',
      '10월이 되면 날씨가 쌀쌀해지고 단풍이 든다.',
      '사람들은 단풍을 구경하러 산에 간다.',
      '겨울에는 기온이 영하로 내려가는 날이 많고 눈이 자주 내린다.',
      '나는 스키를 타 본 적이 없어서 이번 겨울에 친구들과 스키장에 가 보려고 한다. 빨리 겨울이 왔으면 좋겠다.'
    ];

    // 2) 치환 본문
    var PASSAGE_2 = [
      '시간이 참 빨리 지나간다.',
      '처음 한국에 왔을 때 겨울이었는데 지금은 봄, 여름이 지나고 가을이 되었다.',
      '한국의 계절은 우리 나라와 아주 다르다.',
      '우리 나라는 계절의 변화가 거의 없고 일 년 내내 따뜻한 편이다.',
      '하지만 한국은 사계절이 있다.',
      '한국은 봄에 날씨가 따뜻하고 바람이 많이 분다.',
      '여름에는 날씨가 매우 덥고 태풍이 온다.',
      '또 장마가 있어서 비가 많이 온다.',
      '내가 제일 좋아하는 계절은 가을이다.',
      '10월이 되면 날씨가 쌀쌀해지고 나뭇잎이 떨어진다.',
      '사람들은 단풍을 구경하러 산에 간다.',
      '겨울에는 기온이 영하로 내려가는 날이 많고 얼음이 자주 언다.',
      '나는 스키를 타 본 적이 없어서 이번 겨울에 친구들과 스키장에 가 보려고 한다. 빨리 겨울이 왔으면 좋겠다.'
    ];

    var currentPassage = PASSAGE_1;
    var turn = 0;
    var responses = new Array(currentPassage.length).fill('');
    var scores = new Array(currentPassage.length).fill(null);
    var completed = false;
    var recognition = null;
    var isRecognizing = false;

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR';
      u.rate = 0.86;
      window.speechSynthesis.speak(u);
    }

    function initRecognition() {
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return;
      try {
        recognition = new SR();
        recognition.lang = 'ko-KR';
        recognition.onstart = function() {
          isRecognizing = true;
          var btn = document.getElementById('btnMic');
          btn.classList.add('recognizing');
          btn.textContent = '🔴 듣는 중... 읽으세요';
        };
        recognition.onresult = function(e) {
          var text = e.results[0][0].transcript;
          if (text) {
            commitSpoken(text);
          }
        };
        recognition.onend = function() {
          isRecognizing = false;
          var btn = document.getElementById('btnMic');
          btn.classList.remove('recognizing');
          btn.textContent = '🎤 음성으로 읽기';
        };
      } catch(e) {
        console.warn('음성인식 미지원');
      }
    }

    function commitSpoken(text) {
      if (completed) return;
      var curTarget = currentPassage[turn];
      var clean = function(s) { return (s || '').replace(/[\s.,?!]/g, ''); };
      var t = clean(curTarget);
      var s = clean(text);

      var match = 0;
      for (var i = 0; i < Math.min(t.length, s.length); i++) {
        if (t[i] === s[i]) match++;
      }
      var score = Math.floor((match / Math.max(t.length, s.length)) * 100);

      responses[turn] = text;
      scores[turn] = score;

      renderPassage();
      updateControls();
    }

    function renderPassage() {
      var win = document.getElementById('textWindow');
      if (!win) return;
      win.innerHTML = '';

      for (var idx = 0; idx < currentPassage.length; idx++) {
        var sentence = currentPassage[idx];
        var isCurrent = !completed && idx === turn;

        var card = document.createElement('div');
        card.className = 'sentence-card';
        card.setAttribute('data-current', isCurrent ? 'true' : 'false');

        var markHtml = '';
        if (scores[idx] !== null) {
          var mChar = 'X';
          var mCls = 'mark-X';
          if (scores[idx] >= 85) { mChar = 'O'; mCls = 'mark-O'; }
          else if (scores[idx] >= 65) { mChar = '△'; mCls = 'mark-triangle'; }
          markHtml = '<span class="feedback-mark ' + mCls + '">' + mChar + ' (' + scores[idx] + '점)</span>';
        }

        var userHtml = responses[idx] ? '<div class="spoken-user-text">🗣️ 내가 읽은 내용: ' + responses[idx] + '</div>' : '';

        card.innerHTML = 
          '<div class="card-top-info">' +
            '<span class="num-tag">문장 ' + (idx + 1) + '</span>' +
            markHtml +
          '</div>' +
          '<div class="target-sentence">' + sentence + '</div>' +
          userHtml;

        win.appendChild(card);
      }
    }

    function updateControls() {
      var statusBadge = document.getElementById('statusBadge');
      var promptTarget = document.getElementById('promptTarget');
      var btnTurn = document.getElementById('btnTurnFlow');
      var prog = document.getElementById('progressTag');
      var btnMic = document.getElementById('btnMic');
      var btnListen = document.getElementById('btnListen');

      prog.textContent = '진행 ' + (turn + 1) + ' / ' + currentPassage.length;

      if (completed) {
        statusBadge.textContent = '🎉 낭독 완료';
        statusBadge.style.background = '#15803d';
        promptTarget.textContent = '모든 문장 낭독을 끝마쳤습니다! 참 잘하셨습니다.';
        btnMic.disabled = true;
        btnListen.disabled = true;
        btnTurn.disabled = false;
        btnTurn.textContent = '처음부터 다시';
        return;
      }

      statusBadge.textContent = '문장 ' + (turn + 1) + ' 낭독 중';
      statusBadge.style.background = 'var(--primary-theme)';
      promptTarget.textContent = currentPassage[turn];

      document.getElementById('txtInput').value = '';
      btnMic.disabled = false;
      btnListen.disabled = false;

      btnTurn.disabled = !responses[turn];
      btnTurn.textContent = (turn === currentPassage.length - 1) ? '낭독 마치기' : '다음 문장 ➔';
    }

    function resetAll() {
      turn = 0;
      responses = new Array(currentPassage.length).fill('');
      scores = new Array(currentPassage.length).fill(null);
      completed = false;
      renderPassage();
      updateControls();
    }

    function setupEvents() {
      initRecognition();
      renderPassage();
      updateControls();

      document.getElementById('btnScen1').onclick = function() {
        currentPassage = PASSAGE_1;
        document.getElementById('btnScen1').className = 'btn-scenario active';
        document.getElementById('btnScen2').className = 'btn-scenario';
        document.getElementById('readingTitle').textContent = '🍂 한국의 계절 본문 읽기 (기본)';
        resetAll();
      };

      document.getElementById('btnScen2').onclick = function() {
        currentPassage = PASSAGE_2;
        document.getElementById('btnScen2').className = 'btn-scenario active';
        document.getElementById('btnScen1').className = 'btn-scenario';
        document.getElementById('readingTitle').textContent = '🍂 한국의 계절 본문 읽기 (치환)';
        resetAll();
      };

      document.getElementById('btnListen').onclick = function() {
        if (!completed) speakText(currentPassage[turn]);
      };

      document.getElementById('btnMic').onclick = function() {
        if (recognition && !isRecognizing) {
          recognition.start();
        }
      };

      document.getElementById('btnConfirm').onclick = function() {
        var txt = document.getElementById('txtInput').value;
        if (txt) commitSpoken(txt);
      };

      document.getElementById('btnReset').onclick = function() {
        resetAll();
      };

      document.getElementById('btnTurnFlow').onclick = function() {
        if (completed) { resetAll(); return; }
        if (turn < currentPassage.length - 1) { turn++; } else { completed = true; }
        renderPassage();
        updateControls();
      };

      var qrModal = document.getElementById('qrModal');
      document.getElementById('btnOpenQr').onclick = function() {
        var targetUrl = window.location.href.startsWith('http') 
          ? window.location.href 
          : 'https://thigp3.github.io/2A-2B/2b-18-2solo.html';
        var currentUrl = encodeURIComponent(targetUrl);
        var qrImg = document.getElementById('qrImg');
        qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=' + currentUrl;
        qrModal.style.display = 'flex';
      };
      document.getElementById('btnCloseQr').onclick = function() {
        qrModal.style.display = 'none';
      };
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', setupEvents);
    } else {
      setupEvents();
    }
  </script>
</body>
</html>
